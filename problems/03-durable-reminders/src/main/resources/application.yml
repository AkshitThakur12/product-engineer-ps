spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/reminders_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

server:
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Scheduler configuration
app:
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:true}
    fixed-delay-ms: ${APP_SCHEDULER_FIXED_DELAY_MS:5000}
  retry:
    max-attempts: ${APP_RETRY_MAX_ATTEMPTS:3}
    delays-seconds: ${APP_RETRY_DELAYS_SECONDS:0,10,30}
